name: Publish language apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Test Kannada audio logic
        run: node --test kanada/tests/*.test.mjs
      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site/kanada/audio _site/kanada/day-1/audio _site/kanada/day-2/audio _site/kanada/day-3/audio _site/kanada/day-4/audio _site/kanada/read/audio _site/kanada/numbers/audio _site/kanada/alphabet/audio
          cp index.html _site/index.html
          cp kanada/index.html kanada/styles.css kanada/app.js kanada/phrases.mjs kanada/recorded.mjs kanada/quiz-feedback.mjs kanada/speech.mjs _site/kanada/
          cp kanada/audio/*.mp3 _site/kanada/audio/
          cp kanada/day-1/index.html kanada/day-1/styles.css kanada/day-1/app.js kanada/day-1/content.mjs _site/kanada/day-1/
          cp kanada/day-1/audio/*.mp3 _site/kanada/day-1/audio/
          cp kanada/day-2/index.html kanada/day-2/styles.css kanada/day-2/app.js kanada/day-2/content.mjs _site/kanada/day-2/
          cp kanada/day-2/audio/*.mp3 _site/kanada/day-2/audio/
          cp kanada/day-3/index.html kanada/day-3/styles.css kanada/day-3/app.js kanada/day-3/content.mjs _site/kanada/day-3/
          cp kanada/day-3/audio/*.mp3 _site/kanada/day-3/audio/
          cp kanada/day-4/index.html kanada/day-4/styles.css kanada/day-4/app.js kanada/day-4/content.mjs _site/kanada/day-4/
          cp kanada/day-4/audio/*.mp3 _site/kanada/day-4/audio/
          cp kanada/read/index.html kanada/read/styles.css kanada/read/app.js kanada/read/content.mjs _site/kanada/read/
          cp kanada/read/audio/*.mp3 _site/kanada/read/audio/
          cp kanada/numbers/index.html kanada/numbers/styles.css kanada/numbers/app.js kanada/numbers/content.mjs _site/kanada/numbers/
          cp kanada/numbers/audio/*.mp3 _site/kanada/numbers/audio/
          cp kanada/alphabet/index.html kanada/alphabet/styles.css kanada/alphabet/app.js kanada/alphabet/content.mjs _site/kanada/alphabet/
          cp kanada/alphabet/audio/*.mp3 _site/kanada/alphabet/audio/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
